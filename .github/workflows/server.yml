# SPDX-License-Identifier: AGPL-3.0-or-later
name: server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Docker build (no push)
        run: docker build -t fortune-teahouse-scoreboard .
      - name: Container smoke test
        run: |
          docker run -d --name sb -p 8000:8000 -e ADMIN_SECRET=ci fortune-teahouse-scoreboard
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/v1/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/v1/summary > /dev/null
          curl -fsS http://localhost:8000/bigscreen/ | grep -q "github.com"
          docker rm -f sb
