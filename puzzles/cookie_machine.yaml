# Cookie Machine core puzzle: which jar holds which ingredient.
# Spoiler warning: this file contains the answer. See puzzles/README.md.
schema_version: 1
machine:
  id: cookie_machine
  name: Cookie Machine
  puzzle_title: Batter recipe
domain:
  item_noun: ingredient
  position_noun: jar
  order: "jars 1 to 5, left to right"
  items:
    - id: sugar
      name: Sugar
    - id: flour
      name: Flour
    - id: butter
      name: Butter
    - id: vanilla
      name: Vanilla
    - id: egg
      name: Egg
  positions:
    - index: 1
      label: Jar 1
    - index: 2
      label: Jar 2
    - index: 3
      label: Jar 3
    - index: 4
